name: DVMX Tekton compatibility finalize

on:
  push:
    branches:
      - feat/tekton-operator-compatibility
    paths:
      - '.github/workflows/dvmx-tekton-finalize.yml'

jobs:
  generate-and-verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bounty branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Install compatibility tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r utils/compatibility/requirements.txt jsonschema

      - name: Run focused Tekton scraper tests
        working-directory: utils/compatibility
        run: python -m unittest tests.test_tekton_operator -v

      - name: Run live Tekton scraper and regenerate aggregate
        working-directory: utils/compatibility
        env:
          OPENAI_API_KEY: ''
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          from utils import read_yaml, write_yaml

          scraper_path = Path('scrapers/tekton-operator.py')
          spec = importlib.util.spec_from_file_location('tekton_operator', scraper_path)
          scraper = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(scraper)
          scraper.scrape()

          manifest = read_yaml('../../static/compatibilities/manifest.yaml')
          if not isinstance(manifest, dict) or not isinstance(manifest.get('names'), list):
              raise SystemExit('invalid compatibility manifest')

          addons = []
          for name in manifest['names']:
              addon = read_yaml(f'../../static/compatibilities/{name}.yaml')
              if not isinstance(addon, dict):
                  raise SystemExit(f'invalid compatibility data for {name}')
              addon = dict(addon)
              addon['name'] = name
              addons.append(addon)

          write_yaml('../../static/compatibilities.yaml', {'addons': addons})
          PY

      - name: Validate generated compatibility schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml
          from jsonschema import Draft7Validator

          schema = json.loads(Path('static/compatibilities/schema.json').read_text())
          validator = Draft7Validator(schema)
          files = [Path('static/compatibilities.yaml'), *sorted(Path('static/compatibilities').glob('*.yaml'))]
          for path in files:
              data = yaml.safe_load(path.read_text())
              errors = sorted(validator.iter_errors(data), key=lambda e: list(e.path))
              if errors:
                  raise SystemExit(f'{path}: {errors[0].message}')

          tekton = yaml.safe_load(Path('static/compatibilities/tekton-operator.yaml').read_text())
          versions = {str(v['version']): v for v in tekton['versions']}
          assert versions['0.81.1']['kube'] == ['1.36', '1.35', '1.34']
          assert versions['0.80.0']['kube'][-1] == '1.28'
          assert versions['0.81.1'].get('images')
          assert versions['0.80.0'].get('images')

          aggregate = yaml.safe_load(Path('static/compatibilities.yaml').read_text())
          matches = [a for a in aggregate['addons'] if a.get('name') == 'tekton-operator']
          assert len(matches) == 1
          assert matches[0]['versions'] == tekton['versions']
          print('schema, image, floor, and aggregate checks passed')
          PY

      - name: Diff integrity
        run: git diff --check

      - name: Package generated outputs
        run: |
          mkdir -p /tmp/dvmx-output/static/compatibilities
          cp static/compatibilities.yaml /tmp/dvmx-output/static/compatibilities.yaml
          cp static/compatibilities/tekton-operator.yaml /tmp/dvmx-output/static/compatibilities/tekton-operator.yaml

      - name: Upload verified outputs
        uses: actions/upload-artifact@v4
        with:
          name: dvmx-tekton-generated
          path: /tmp/dvmx-output
          if-no-files-found: error

  commit-generated-output:
    needs: generate-and-verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bounty branch
        uses: actions/checkout@v4
        with:
          ref: feat/tekton-operator-compatibility

      - name: Download verified outputs
        uses: actions/download-artifact@v4
        with:
          name: dvmx-tekton-generated
          path: /tmp/dvmx-output

      - name: Apply generated outputs only
        run: |
          cp /tmp/dvmx-output/static/compatibilities.yaml static/compatibilities.yaml
          cp /tmp/dvmx-output/static/compatibilities/tekton-operator.yaml static/compatibilities/tekton-operator.yaml
          git diff --check

      - name: Commit generated compatibility output
        run: |
          git config user.name 'dvmx-bounty-workcell'
          git config user.email 'actions@users.noreply.github.com'
          git add static/compatibilities.yaml static/compatibilities/tekton-operator.yaml
          if git diff --cached --quiet; then
            echo 'Generated outputs already match branch state.'
          else
            git commit -m 'chore: regenerate Tekton compatibility output'
            git push origin HEAD:feat/tekton-operator-compatibility
          fi
