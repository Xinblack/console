name: Build DV Motion Mail GIFs

on:
  push:
    branches: [dv-motion-mail-assets]
    paths:
      - "dv-motion-mail-assets/build_gifs.py"
      - "dv-motion-mail-assets/specs.json"
      - ".github/workflows/dv-motion-mail-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-gifs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: dv-motion-mail-assets
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: pip install pillow

      - name: Generate animated GIFs
        run: python dv-motion-mail-assets/build_gifs.py

      - name: Commit generated GIFs
        run: |
          git config user.name "DV Motion Mail Bot"
          git config user.email "actions@users.noreply.github.com"
          git add dv-motion-mail-assets/gifs/*.gif
          if git diff --cached --quiet; then
            echo "No GIF changes"
            exit 0
          fi
          git commit -m "Build Motion Ideal Alpha GIF assets"
          git push origin HEAD:dv-motion-mail-assets
